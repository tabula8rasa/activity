<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6e9">
  <title>Activity — 100 карточек</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20211e;
      --cream: #fff6e9;
      --paper: #ffcb83;
      --green: #11744e;
      --brown: #a64d12;
      --pink: #ff7176;
      --red: #d72823;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
      background:
        radial-gradient(ellipse at 8% 11%, #ffd6a7 0, transparent 35%),
        radial-gradient(ellipse at 92% 88%, #ffe0c6 0, transparent 42%),
        var(--cream);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .24;
      background-image: radial-gradient(#aa8766 0.65px, transparent 0.65px);
      background-size: 18px 18px;
    }
    .app {
      position: relative;
      width: min(100% - 36px, 450px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 34px 0 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .heading { margin-bottom: 22px; }
    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.4;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }
    .age-pill {
      padding: 5px 10px;
      border: 1.5px solid currentColor;
      border-radius: 100px;
      background: #fffdfa;
      letter-spacing: .7px;
    }
    h1 {
      position: relative;
      width: fit-content;
      margin: 0;
      font-family: 'Arial Black', Impact, 'Trebuchet MS', sans-serif;
      font-size: clamp(54px, 13vw, 72px);
      line-height: .98;
      letter-spacing: -4.4px;
      text-transform: uppercase;
    }
    h1::after {
      content: '';
      position: absolute;
      right: -17px;
      top: 4px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #f75d58;
      border: 2px solid var(--ink);
    }
    .tagline {
      margin: 9px 0 0;
      font-size: 14px;
      font-weight: 650;
      color: #5d5347;
    }
    .game-card {
      position: relative;
      isolation: isolate;
      width: 100%;
      padding: 14px;
      border: 2px solid var(--ink);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 8px 9px 0 var(--ink);
    }
    .game-card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      border-radius: inherit;
      background: radial-gradient(circle at top right, #ffeab5, transparent 55%);
    }
    .card-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 12px;
      gap: 10px;
    }
    .card-bar strong {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .card-count {
      font-size: 12px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .three-dots { display: inline-flex; align-items: center; gap: 5px; }
    .three-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
    .tasks { display: grid; gap: 10px; }
    .task {
      min-height: 117px;
      padding: 15px 16px 14px;
      border: 2px solid var(--ink);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-wrap: anywhere;
    }
    .draw { background: var(--green); color: white; }
    .talk { background: var(--brown); color: white; }
    .mime { background: var(--pink); color: var(--ink); }
    .task-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .task-type { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 900; letter-spacing: 1.25px; text-transform: uppercase; }
    .task-type svg { width: 18px; height: 18px; flex: none; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .score {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      min-width: 73px;
      min-height: 31px;
      padding: 4px 10px;
      border-radius: 9px;
      background: #fff9e9;
      color: #25201c;
      border: 1.5px solid rgba(0,0,0,.3);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .score strong { font-size: 20px; line-height: 1; padding-right: 5px; }
    .word {
      margin: 10px 0 0;
      font-size: clamp(21px, 5.3vw, 29px);
      font-weight: 900;
      line-height: 1.14;
      letter-spacing: -.5px;
    }
    .special {
      display: none;
      align-items: center;
      align-self: flex-start;
      margin-top: 10px;
      padding: 5px 8px;
      border: 1px solid currentColor;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .35px;
      text-transform: uppercase;
    }
    .special.visible { display: inline-flex; }
    .game-card.swap .word { animation: appear .24s ease-out both; }
    @keyframes appear { from { opacity: .2; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 5px 1px;
      color: #694726;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }
    .button-wrap { padding: 22px 4px 0 0; }
    .next-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 66px;
      border: 2px solid var(--ink);
      border-radius: 15px;
      background: var(--red);
      box-shadow: 5px 6px 0 var(--ink);
      color: white;
      font-family: inherit;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform .13s, box-shadow .13s, background-color .13s;
      -webkit-tap-highlight-color: transparent;
    }
    .next-btn svg { width: 23px; height: 23px; stroke: currentColor; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .next-btn:hover { background: #bf1f1b; transform: translateY(-2px); box-shadow: 5px 8px 0 var(--ink); }
    .next-btn:active { transform: translate(4px, 5px); box-shadow: 1px 1px 0 var(--ink); }
    .next-btn:focus-visible { outline: 3px solid #2254c4; outline-offset: 4px; }
    .under-note { padding: 18px 0 0; text-align: center; font-size: 12px; color: #817364; font-weight: 600; }
    @media (max-width: 440px) {
      .app { width: min(100% - 34px, 450px); padding-top: 22px; padding-bottom: 22px; }
      .heading { margin-bottom: 17px; }
      .game-card { padding: 11px; box-shadow: 6px 7px 0 var(--ink); border-radius: 20px; }
      .tasks { gap: 8px; }
      .task { min-height: 109px; padding: 12px 13px; border-radius: 12px; }
      .button-wrap { padding-top: 19px; }
      .next-btn { min-height: 64px; }
    }
    @media (max-height: 730px) {
      .app { justify-content: flex-start; }
      .heading { margin-bottom: 12px; }
      .tagline { margin-top: 5px; }
      .task { min-height: 94px; padding-top: 9px; padding-bottom: 9px; }
      .word { margin-top: 7px; font-size: clamp(20px, 4.8vw, 25px); }
      .button-wrap { padding-top: 16px; }
      .under-note { padding-top: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>

    let order = [];
    let lastCard = -1;

    function shuffleDeck() {
      order = Array.from({length: cards.length}, (_, i) => i);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      if (order.length > 1 && order[order.length - 1] === lastCard) {
        [order[0], order[order.length - 1]] = [order[order.length - 1], order[0]];
      }
    }

    function newCard() {
      if (order.length === 0) shuffleDeck();
      lastCard = order.pop();
      const card = document.getElementById('game-card');
      card.classList.remove('swap');
      void card.offsetWidth; // Restart the subtle entrance animation.
      card.classList.add('swap');
      cards[lastCard].forEach((task, i) => {
        document.getElementById('word' + i).textContent = task.word;
        document.getElementById('points' + i).innerHTML = '<strong>' + task.points + '</strong> ' + (task.points === 3 || task.points === 4 ? 'очка' : 'очков');
        document.getElementById('open' + i).classList.toggle('visible', task.open);
      });
      document.getElementById('card-count').textContent = String(lastCard + 1).padStart(2, '0') + ' / ' + cards.length;
    }

    document.getElementById('next').addEventListener('click', newCard);
    newCard();
  </script>
